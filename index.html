  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }

  .toolbar button.export:hover { background: #15803d; }
  .stats { margin-bottom: 10px; font-size: 14px; color: #475569; }
  .table-wrap { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: right; font-size: 14px; }
  th { background: #f1f5f9; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  tr:hover td { background: #f8fafc; }
  td.num { text-align: center; font-weight: 600; }
  .empty { text-align: center; padding: 30px; color: #94a3b8; }
  @media (max-width: 600px) {
    header h1 { font-size: 20px; }
    th, td { padding: 8px; font-size: 13px; }

const tbody = document.getElementById('tbody');
const searchInput = document.getElementById('search');
const sectionFilter = document.getElementById('sectionFilter');
const stats = document.getElementById('stats');

// تعبئة فلتر الأقسام
const sections = [...new Set(rawData.map(r => r[0]))];
sections.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  sectionFilter.appendChild(opt);
});

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const sec = sectionFilter.value;
  const filtered = rawData.filter(row => {
    const matchSec = !sec || row[0] === sec;
    const text = row.join(' ').toLowerCase();
    const matchQ = !q || text.includes(q);
    return matchSec && matchQ;
  });

  tbody.innerHTML = '';
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">لا توجد نتائج مطابقة</td></tr>';
  } else {
    filtered.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach((cell, i) => {
        const td = document.createElement('td');
        td.textContent = cell;
        if (i === 3) td.className = 'num';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  stats.textContent = `عدد السجلات: ${filtered.length} من ${rawData.length}`;
}

searchInput.addEventListener('input', render);
sectionFilter.addEventListener('change', render);
render();

// تصدير Excel (HTML Table)
function exportExcel() {
  const table = document.getElementById('dataTable').cloneNode(true);
  // إزالة الصفوف المخفية؟ لا يوجد إخفاء، الجدول معروض كامل. لكن نصدّر المعروض فقط.
  const rows = tbody.querySelectorAll('tr');
  const newTbody = document.createElement('tbody');
  rows.forEach(tr => {
    if (tr.querySelector('.empty')) return;
    newTbody.appendChild(tr.cloneNode(true));
  });
  table.querySelector('tbody').replaceWith(newTbody);
  const html = `<html dir="rtl"><head><meta charset="UTF-8"></head><body>${table.outerHTML}</body></html>`;
  const blob = new Blob([html], {type: 'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'جرد_أصول_مصنع_طيبة.xls';
  a.click();
  URL.revokeObjectURL(url);
}

// تصدير CSV
function exportCSV() {
  const rows = tbody.querySelectorAll('tr');
  const lines = [];
  lines.push(['القسم','الفئة','البيان','العدد','اللون','ملاحظات'].join(','));
  rows.forEach(tr => {
    if (tr.querySelector('.empty')) return;
    const cells = [...tr.querySelectorAll('td')].map(td => `"${td.textContent.replace(/"/g,'""')}"`);
    lines.push(cells.join(','));
  });
  const csv = '\uFEFF' + lines.join('\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'جرد_أصول_مصنع_طيبة.csv';
  a.click();
  URL.revokeObjectURL(url);
}
